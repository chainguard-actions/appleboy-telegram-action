name: Test audio, voice, and video inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          to: "123456789"
          token: "fake-token-for-testing"
          message: "Test audio, voice, and video inputs"
          audio: "https://example.com/audio.mp3"
          voice: "https://example.com/voice.ogg"
          video: "https://example.com/video.mp4"
      - name: Assert action ran (audio, voice, video inputs exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with audio, voice, and video inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
