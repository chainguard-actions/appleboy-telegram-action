name: Test audio and voice inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          to: ${{ secrets.TELEGRAM_TO || '0' }}
          token: ${{ secrets.TELEGRAM_TOKEN || 'fake:token' }}
          message: "Test audio and voice inputs"
          audio: "https://example.com/audio.mp3"
          voice: "https://example.com/voice.ogg"
        continue-on-error: true
      - name: Assert action ran with audio and voice inputs
        run: |
          echo "Action completed (may fail due to invalid token/chat, but inputs were passed)"
          echo "PASS: audio and voice inputs were accepted"
