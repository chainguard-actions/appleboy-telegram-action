name: Test debug mode and format input (invalid credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run telegram action with debug and markdown format
        id: action
        uses: .
        continue-on-error: true
        with:
          to: "123456789"
          token: "0000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          message: "*Bold* and _italic_ markdown message"
          format: "markdown"
          debug: "true"

      - name: Assert action failed with invalid credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials in debug+markdown mode"
