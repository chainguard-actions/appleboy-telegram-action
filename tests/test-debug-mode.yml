name: Test debug mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with debug mode enabled (expect failure with invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          to: "123456789"
          token: "fake-bot-token:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          message: "Debug mode test message"
          debug: "true"

      - name: Assert action failed (invalid credentials, debug mode accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials in debug mode"
