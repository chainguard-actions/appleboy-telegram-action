name: Test debug mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run telegram action with debug enabled
        id: action
        uses: .
        continue-on-error: true
        with:
          to: "123456789"
          token: "invalid-token-for-testing"
          message: "Debug mode test message"
          debug: "true"
          format: "markdown"

      - name: Assert action ran with debug mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With debug mode, the action should still run and attempt to send.
          # It will fail due to invalid credentials, but should not panic/crash.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with debug mode enabled"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
