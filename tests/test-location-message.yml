name: Test location message input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - name: Run action with location input (no real token - expect failure gracefully)
        id: action
        uses: .
        continue-on-error: true
        with:
          to: "123456789"
          token: "fake-token-for-input-coverage"
          message: "Test location message"
          location: "37.7749,-122.4194"
      - name: Assert step was attempted with location input
        run: |
          echo "Location input was passed to the action"
          echo "PASS: location input covered"
