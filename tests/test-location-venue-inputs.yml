name: Test location, venue, and message_thread_id inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          to: "123456789"
          token: "fake-token-for-testing"
          message: "Test location, venue, and message_thread_id inputs"
          location: "48.8566,2.3522"
          venue: "48.8566,2.3522,Eiffel Tower,Paris"
          message_thread_id: "42"
      - name: Assert action ran (location, venue, message_thread_id inputs exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with location, venue, and message_thread_id inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
