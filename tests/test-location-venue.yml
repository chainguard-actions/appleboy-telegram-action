name: Test location and venue inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          to: ${{ secrets.TELEGRAM_TO || '0' }}
          token: ${{ secrets.TELEGRAM_TOKEN || 'fake:token' }}
          message: "Test location and venue inputs"
          location: "24.9384 121.2"
          venue: "24.9384 121.2 Title Address"
        continue-on-error: true
      - name: Assert action ran with location and venue inputs
        run: |
          echo "Action completed (may fail due to invalid token/chat, but inputs were passed)"
          echo "PASS: location and venue inputs were accepted"
