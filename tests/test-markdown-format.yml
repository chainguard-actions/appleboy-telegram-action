name: Test markdown format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with markdown format (invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          to: "123456789"
          token: "0000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          message: "*Bold* and _italic_ markdown message"
          format: "markdown"
          disable_web_page_preview: "true"
          disable_notification: "true"

      - name: Assert action ran (success or expected failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid credentials (markdown format)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with markdown format"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
