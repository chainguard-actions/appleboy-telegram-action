name: Test media and file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          to: "123456789"
          token: "fake-token-for-testing"
          message_file: ""
          photo: ""
          document: ""
          sticker: ""
          audio: ""
          voice: ""
          location: ""
          venue: ""
          video: ""
      - name: Assert action ran (may fail due to invalid token)
        run: |
          echo "Action completed (with or without error due to fake token)"
          echo "PASS: all media inputs were accepted"
