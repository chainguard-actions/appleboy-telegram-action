name: Test media and location inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          to: "123456789"
          token: "0000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          message: "Media test message"
          photo: "https://example.com/photo.jpg"
          document: "https://example.com/document.pdf"
          sticker: "https://example.com/sticker.webp"
          audio: "https://example.com/audio.mp3"
          voice: "https://example.com/voice.ogg"
          location: "37.7749,-122.4194"
          venue: "37.7749,-122.4194,Test Venue,123 Test St"
          video: "https://example.com/video.mp4"
      - name: Assert action ran (credentials are fake so failure is expected)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: input coverage verified for media and location inputs"
