name: Test media inputs (photo, document, sticker, audio, voice, video)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          to: "123456789"
          token: "fake-token-for-coverage"
          message: "Test media inputs"
          photo: "https://example.com/photo.jpg"
          document: "https://example.com/document.pdf"
          sticker: "https://example.com/sticker.webp"
          audio: "https://example.com/audio.mp3"
          voice: "https://example.com/voice.ogg"
          video: "https://example.com/video.mp4"
      - name: Assert action ran (fails gracefully with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (invalid credentials expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
