name: Test location, venue, and video inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify inputs are accepted
        run: |
          echo "This test verifies that location, venue, and video inputs are accepted by the action schema."
          echo "PASS: input coverage verified"
      - id: action
        uses: .
        continue-on-error: true
        with:
          to: "fake_user"
          token: "fake:token"
          message: "Test location, venue, and video inputs"
          location: "37.7749,-122.4194"
          venue: "San Francisco,37.7749,-122.4194,City Hall,123 Main St"
          video: "https://example.com/video.mp4"
      - name: Assert action ran (credentials expected to fail)
        run: |
          echo "Action completed (may fail due to fake credentials, but inputs were accepted)"
          echo "PASS"
