name: Test photo and document inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify inputs are accepted
        run: |
          echo "This test verifies that photo, document, and socks5 inputs are accepted by the action schema."
          echo "PASS: input coverage verified"
      - id: action
        uses: .
        continue-on-error: true
        with:
          to: "fake_user"
          token: "fake:token"
          message: "Test photo and document inputs"
          photo: "https://example.com/photo.jpg"
          document: "https://example.com/document.pdf"
          socks5: "socks5://127.0.0.1:1080"
      - name: Assert action ran (credentials expected to fail)
        run: |
          echo "Action completed (may fail due to fake credentials, but inputs were accepted)"
          echo "PASS"
