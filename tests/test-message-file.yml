name: Test message from file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create message file
        run: |
          echo "Hello from a message file!" > /tmp/telegram-message.txt

      - name: Run action with message_file (invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          to: "123456789"
          token: "0000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          message_file: "/tmp/telegram-message.txt"

      - name: Assert action ran (success or expected failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid credentials (message_file)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with message_file"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
