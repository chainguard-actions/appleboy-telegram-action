name: Test message from file
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a message file
        run: |
          echo "Hello from a message file in act test" > /tmp/telegram-message.txt

      - name: Run action with message_file (expect failure with invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          to: "123456789"
          token: "fake-bot-token:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          message_file: "/tmp/telegram-message.txt"

      - name: Assert action failed (invalid credentials, message_file accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials using message_file"
