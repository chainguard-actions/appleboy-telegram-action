name: Test socks5 proxy input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          to: "fake_user_id"
          token: "fake_token"
          message: "Test socks5 proxy message"
          socks5: "socks5://127.0.0.1:1080"
        continue-on-error: true
      - name: Assert action ran (socks5 input accepted)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: socks5 input was accepted by the action"
