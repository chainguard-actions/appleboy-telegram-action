name: Test socks5 proxy (unreachable proxy fails)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          to: "123456789"
          token: "000000000:invalid-telegram-bot-token-for-testing"
          message: "Proxy test"
          socks5: "socks5://127.0.0.1:1"
      - name: Assert action failed (unreachable proxy / invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected"
          else
            echo "FAIL: expected failure, got '$OUTCOME'"
            exit 1
          fi
