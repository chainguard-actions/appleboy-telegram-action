name: Test socks5 proxy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          to: "123456789"
          token: "fake-token:fake"
          message: "Test socks5 proxy message"
          socks5: "socks5://127.0.0.1:1080"
      - name: Assert action ran
        run: |
          echo "Action completed (may fail due to fake credentials/proxy, which is expected)"
          echo "PASS: socks5 input was passed to the action"
