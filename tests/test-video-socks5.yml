name: Test video and socks5 inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          to: ${{ secrets.TELEGRAM_TO || '0' }}
          token: ${{ secrets.TELEGRAM_TOKEN || 'fake:token' }}
          message: "Test video and socks5 inputs"
          video: "https://example.com/video.mp4"
          socks5: "socks5://127.0.0.1:1080"
        continue-on-error: true
      - name: Assert action ran with video and socks5 inputs
        run: |
          echo "Action completed (may fail due to invalid token/chat or proxy, but inputs were passed)"
          echo "PASS: video and socks5 inputs were accepted"
